<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VALORANT Tracker</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><main class="container"><section class="card hero"><h1>VALORANT Tracker</h1><p>Личная статистика и анализ матчей.</p>{% with m=get_flashed_messages() %}{% for x in m %}<div class="message">{{x}}</div>{% endfor %}{% endwith %}{% if logged_in %}<a class="button" href="{{url_for('profile')}}">Открыть профиль</a>{% else %}<a class="button" href="{{url_for('login')}}">Войти через Riot</a>{% endif %}</section><section class="card"><h2>Riot verification</h2><p><code>/riot.txt</code></p><p class="muted">После публикации: https://твой-домен/riot.txt</p></section></main></body></html>
